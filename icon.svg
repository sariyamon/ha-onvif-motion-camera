<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F8DF5"/>
      <stop offset="1" stop-color="#1565C0"/>
    </linearGradient>
  </defs>
  <!-- wall mount -->
  <rect x="34" y="150" width="18" height="74" rx="6" fill="#607D8B"/>
  <path d="M43 168 L82 138" stroke="#607D8B" stroke-width="16" stroke-linecap="round"/>
  <!-- camera body (tilted) -->
  <g transform="rotate(-18 128 110)">
    <rect x="62" y="78" width="138" height="66" rx="18" fill="url(#body)"/>
    <rect x="62" y="78" width="138" height="18" rx="9" fill="#ffffff" fill-opacity="0.18"/>
    <!-- lens -->
    <circle cx="190" cy="111" r="30" fill="#0D2A4F"/>
    <circle cx="190" cy="111" r="19" fill="#1E3A5F" stroke="#90CAF9" stroke-width="5"/>
    <circle cx="183" cy="104" r="5" fill="#E3F2FD"/>
    <!-- status light -->
    <circle cx="84" cy="122" r="6" fill="#FF7043"/>
  </g>
  <!-- motion waves -->
  <g fill="none" stroke="#FF9800" stroke-linecap="round">
    <path d="M206 158 A 34 34 0 0 1 232 190" stroke-width="11"/>
    <path d="M196 182 A 18 18 0 0 1 208 198" stroke-width="11"/>
  </g>
  <circle cx="190" cy="206" r="9" fill="#FF9800"/>
</svg>
